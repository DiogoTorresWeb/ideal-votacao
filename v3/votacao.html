<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Votação de fontes e hero — Ideal Elétrica</title>
  <link rel="preload" href="assets/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: Archivo;
      font-style: normal;
      font-weight: 100 900;
      font-stretch: 62% 125%;
      font-display: swap;
      src: url(assets/fonts/archivo-variable-latin.woff2) format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: Archivo;
      font-style: normal;
      font-weight: 100 900;
      font-stretch: 62% 125%;
      font-display: swap;
      src: url(assets/fonts/archivo-variable-latin-ext.woff2) format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --bar-bg: #121417;
      --bar-text: #f4f1ea;
      --bar-muted: #b8b4ab;
      --bar-line: rgba(244, 241, 234, 0.14);
      --bar-accent: #ffcc00;
      --bar-btn: #1c1f24;
      --bar-btn-on: #ffcc00;
      --bar-btn-on-text: #121417;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variation-settings: "wdth" 100;
      background: #0b0c0c;
      color: var(--bar-text);
      overflow: hidden;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100svh;
      min-height: 100%;
    }

    .bar {
      flex: 0 0 auto;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-line);
      padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 12px calc(16px + var(--safe-l));
      z-index: 2;
    }

    .bar-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .intro {
      min-width: 0;
      flex: 1 1 220px;
    }

    .kicker {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bar-muted);
      font-weight: 600;
    }

    .combo {
      margin: 0;
      font-weight: 800;
      font-variation-settings: "wdth" 112;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--bar-accent);
    }

    .hint {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--bar-muted);
      max-width: 62ch;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px 16px;
      margin-top: 12px;
    }

    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
    }

    legend {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bar-muted);
      margin-bottom: 6px;
      padding: 0;
    }

    .seg {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .seg button, .btn-full {
      appearance: none;
      border: 1px solid var(--bar-line);
      background: var(--bar-btn);
      color: var(--bar-text);
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      min-height: 44px;
      min-width: 44px;
      padding: 0 14px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }

    .seg button[aria-pressed="true"] {
      background: var(--bar-btn-on);
      color: var(--bar-btn-on-text);
      border-color: var(--bar-btn-on);
    }

    .btn-full {
      margin-left: auto;
      background: transparent;
      border-color: var(--bar-accent);
      color: var(--bar-accent);
    }
    .btn-full[aria-pressed="true"] {
      background: var(--bar-accent);
      color: var(--bar-btn-on-text);
    }

    .preview {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: #000;
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* Modo expandido: preenche a janela mesmo se a Fullscreen API falhar (iOS, iframes). */
    body.is-expanded .shell,
    body.is-fs .shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      height: 100dvh;
      height: 100svh;
      width: 100%;
    }
    body.is-expanded .hint {
      display: none;
    }
    body.is-expanded .bar {
      padding-top: calc(8px + var(--safe-t));
      padding-bottom: 8px;
    }

    @media (max-width: 600px) {
      .btn-full { margin-left: 0; width: 100%; }
      .controls { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="bar">
      <div class="bar-top">
        <div class="intro">
          <p class="kicker">Votação no site de verdade</p>
          <p class="combo" id="combo" aria-live="polite">«F1 + H1»</p>
          <p class="hint">Esta é a home atual. Logo L3 e paleta P1 estão fixas. Troque o par de fontes e a hero (título e subtítulo) e veja a home mudar ao vivo. Responda com a combinação, por exemplo «F2 + H3».</p>
        </div>
      </div>
      <div class="controls">
        <fieldset>
          <legend>Fonte</legend>
          <div class="seg" id="fontes" role="group" aria-label="Par de fontes">
            <button type="button" data-fonte="F1" aria-pressed="true">F1 Archivo</button>
            <button type="button" data-fonte="F2" aria-pressed="false">F2 Space Grotesk</button>
            <button type="button" data-fonte="F3" aria-pressed="false">F3 Newsreader</button>
            <button type="button" data-fonte="F4" aria-pressed="false">F4 Outfit</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Hero</legend>
          <div class="seg" id="heroes" role="group" aria-label="Título e subtítulo da hero">
            <button type="button" data-hero="H1" aria-pressed="true">H1 atual</button>
            <button type="button" data-hero="H2" aria-pressed="false">H2</button>
            <button type="button" data-hero="H3" aria-pressed="false">H3</button>
            <button type="button" data-hero="H4" aria-pressed="false">H4</button>
            <button type="button" data-hero="H5" aria-pressed="false">H5</button>
            <button type="button" data-hero="H6" aria-pressed="false">H6</button>
          </div>
        </fieldset>
        <button type="button" class="btn-full" id="btn-full" aria-pressed="false">Tela cheia</button>
      </div>
    </header>
    <div class="preview" id="preview">
      <iframe id="site" src="index.html" title="Prévia da home atual da Ideal Elétrica" allowfullscreen></iframe>
    </div>
  </div>
  <script>
    (function () {
      try { sessionStorage.setItem("ie_intro_seen", "1"); } catch (e) {}

      var iframe = document.getElementById("site");
      var comboEl = document.getElementById("combo");
      var btnFull = document.getElementById("btn-full");
      var shell = document.getElementById("shell");
      var fonte = "F1";
      var hero = "H1";
      var FONTES = {
        F1: "Archivo",
        F2: "Space Grotesk",
        F3: "Newsreader",
        F4: "Outfit"
      };
      var HEROES = {
        H1: {
          title: "Elétrica que protege sua casa, <em>não só liga a luz</em>",
          lede: "Instalação, manutenção e projetos elétricos para residências e empresas, dentro da norma, em toda a Grande São Paulo."
        },
        H2: {
          title: "Instalação elétrica para residência e empresa, dentro da norma",
          lede: "Manutenção e projetos em Itaquaquecetuba e em toda a Grande São Paulo."
        },
        H3: {
          title: "Elétrica de casa e de prédio, em toda a Grande São Paulo",
          lede: "Instalação, manutenção e projetos, do quadro à iluminação, feitos dentro da norma."
        },
        H4: {
          title: "Quadro, fiação e iluminação no lugar certo",
          lede: "Serviço de instalação, manutenção e projeto para casa e empresa, em toda a Grande São Paulo."
        },
        H5: {
          title: "De Itaquaquecetuba para toda a Grande São Paulo",
          lede: "Instalação, manutenção e projetos elétricos para residências e empresas, dentro da norma."
        },
        H6: {
          title: "Serviço elétrico para a casa, o prédio e a reforma",
          lede: "Instalação e manutenção dentro da norma, com orçamento combinado, na Grande São Paulo."
        }
      };

      function parseHash() {
        var m = (location.hash || "").match(/F([1-4])\s*\+\s*H([1-6])/i);
        if (!m) return;
        fonte = "F" + m[1];
        hero = "H" + m[2];
      }

      function syncHash() {
        var next = fonte + "+" + hero;
        if ((location.hash || "").replace(/^#/, "") !== next) {
          history.replaceState(null, "", "#" + next);
        }
      }

      function setPressed(root, attr, value) {
        root.querySelectorAll("[" + attr + "]").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute(attr) === value ? "true" : "false");
        });
      }

      function applyAttrs() {
        comboEl.textContent = "«" + fonte + " + " + hero + "»";
        var hint = document.querySelector(".hint");
        if (hint) {
          var plain = HEROES[hero].title.replace(/<[^>]+>/g, "");
          hint.textContent = "Fonte: " + FONTES[fonte] + ". Hero: “" + plain + "”. Logo L3 e paleta P1 estão fixas. Responda com a combinação, por exemplo «F2 + H3».";
        }
        setPressed(document.getElementById("fontes"), "data-fonte", fonte);
        setPressed(document.getElementById("heroes"), "data-hero", hero);
        syncHash();
        try {
          var doc = iframe.contentDocument;
          if (!doc) return;
          try { doc.defaultView.sessionStorage.setItem("ie_intro_seen", "1"); } catch (e) {}
          doc.documentElement.setAttribute("data-logo", "L3");
          doc.documentElement.setAttribute("data-paleta", "P1");
          doc.documentElement.setAttribute("data-fonte", fonte);
          doc.documentElement.setAttribute("data-hero", hero);
          var titleEl = doc.querySelector(".hero-title");
          var ledeEl = doc.querySelector(".hero .lede");
          if (titleEl) titleEl.innerHTML = HEROES[hero].title;
          if (ledeEl) ledeEl.textContent = HEROES[hero].lede;
        } catch (e) {}
      }

      function fsElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function isFs() {
        var el = fsElement();
        return el === shell || el === document.documentElement;
      }

      function isExpanded() {
        return document.body.classList.contains("is-expanded");
      }

      function requestFs(el) {
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        return fn ? fn.call(el) : Promise.reject();
      }

      function exitFs() {
        var fn = document.exitFullscreen || document.webkitExitFullscreen;
        return fn ? fn.call(document) : Promise.resolve();
      }

      function updateFullBtn() {
        var on = isFs() || isExpanded();
        btnFull.setAttribute("aria-pressed", on ? "true" : "false");
        btnFull.textContent = on ? "Sair da tela cheia" : "Tela cheia";
        document.body.classList.toggle("is-fs", isFs());
      }

      function enterFull() {
        document.body.classList.add("is-expanded");
        updateFullBtn();
        var p = requestFs(shell);
        if (p && p.then) p.catch(function () { updateFullBtn(); });
        else updateFullBtn();
      }

      function exitFull() {
        document.body.classList.remove("is-expanded");
        if (fsElement()) {
          var p = exitFs();
          if (p && p.then) p.catch(function () { updateFullBtn(); }).then(updateFullBtn);
          else updateFullBtn();
        } else {
          updateFullBtn();
        }
      }

      parseHash();
      iframe.addEventListener("load", applyAttrs);
      applyAttrs();

      document.getElementById("fontes").addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-fonte]");
        if (!btn) return;
        fonte = btn.getAttribute("data-fonte");
        applyAttrs();
      });
      document.getElementById("heroes").addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-hero]");
        if (!btn) return;
        hero = btn.getAttribute("data-hero");
        applyAttrs();
      });

      btnFull.addEventListener("click", function () {
        if (isFs() || isExpanded()) exitFull();
        else enterFull();
      });

      document.addEventListener("fullscreenchange", function () {
        if (!isFs()) document.body.classList.remove("is-expanded");
        updateFullBtn();
      });
      document.addEventListener("webkitfullscreenchange", function () {
        if (!isFs()) document.body.classList.remove("is-expanded");
        updateFullBtn();
      });
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && isExpanded() && !isFs()) exitFull();
      });
    })();
  </script>
</body>
</html>
